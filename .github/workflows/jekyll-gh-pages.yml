name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
        run: |
          ruby -ryaml -e 'File.write(File.join(ENV.fetch("RUNNER_TEMP"), "_config.pages.yml"), {"url"=>ENV.fetch("PAGES_ORIGIN"), "baseurl"=>ENV.fetch("PAGES_BASE"), "clarity_id"=>ENV.fetch("CLARITY_ID", "")}.to_yaml)'
          bundle exec jekyll build --strict_front_matter --config _config.yml,_config.clarity.yml,$RUNNER_TEMP/_config.pages.yml
      - name: Check generated site
        run: npm run check:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
