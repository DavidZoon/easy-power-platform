<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#272836">
{% seo %}
{% assign keywords = page.tags | default: site.keywords %}
<meta name="keywords" content="{{ keywords | join: ', ' | escape }}">
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
{% feed_meta %}
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{% if page.layout == 'post' %}
<script src="{{ '/assets/js/post.js' | relative_url }}" defer></script>
{% endif %}
{% if page.search %}
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
{% endif %}
{% if site.clarity_id != '' or site.giscus.enabled or site.newsletter.url %}
<script src="{{ '/assets/js/integrations.js' | relative_url }}" defer></script>
{% endif %}
