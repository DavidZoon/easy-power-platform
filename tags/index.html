---
title: Tags
permalink: /tags/
---
<div class="chips tag-cloud">
{% for term in site.data.taxonomies.tags %}
<a class="chip tag" style="--tag-hue: {{ term.hue }}" href="{{ '/tags/' | append: term.slug | append: '/' | relative_url }}">{{ term.name | escape }} <span class="count" data-count="{{ term.count }}">{% include taxonomy-count.html term=term %}</span></a>
{% endfor %}
</div>
